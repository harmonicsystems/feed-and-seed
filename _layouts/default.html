<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fff;
      color: #111;
      line-height: 1.5;
    }
    a { color: #5a1a2a; }
    a:visited { color: #3a0a1a; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    hr { border: none; border-top: 1px solid #ccc; margin: 1.5rem 0; }
    .site-header { margin-bottom: 2rem; }
    .site-header a { text-decoration: none; color: #111; }
    .site-header p { margin: 0; font-size: 0.9rem; color: #666; }
    ul { padding-left: 1.2rem; }
    li { margin-bottom: 0.3rem; }
    .footer { margin-top: 3rem; font-size: 0.8rem; color: #999; }
  </style>
</head>
<body>
  <div class="site-header">
    <h1><a href="/">Feed &amp; Seed</a></h1>
    <p>{{ site.description }}</p>
  </div>
  <hr>
  {{ content }}
  <div class="footer">
    <hr>
    feed-and-seed.com
  </div>
</body>
</html>
